name: Metropolitan Landscape Live

on:
  workflow_dispatch:

jobs:
  landscape-live:
    runs-on: ubuntu-latest

    timeout-minutes: 355

    steps:

      # ─────────────────────────────────────────────
      # CHECKOUT
      # ─────────────────────────────────────────────

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────
      # PYTHON
      # ─────────────────────────────────────────────

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ─────────────────────────────────────────────
      # FFMPEG INSTALL
      # ─────────────────────────────────────────────

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

          echo "FFmpeg Version:"
          ffmpeg -version | head -1

      # ─────────────────────────────────────────────
      # PYTHON DEPENDENCIES
      # ─────────────────────────────────────────────

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install -r requirements.txt

          # Google Drive downloader
          pip install gdown==4.7.3

      # ─────────────────────────────────────────────
      # SYSTEM OPTIMIZATION
      # ─────────────────────────────────────────────

      - name: Optimize Linux Network Buffers
        run: |
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216

          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 16777216"
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 16777216"

      # ─────────────────────────────────────────────
      # KEEP ALIVE LOGGER
      # ─────────────────────────────────────────────

      - name: Keep-alive heartbeat
        run: |
          while true; do
            echo "⏳ $(date '+%H:%M:%S') — landscape worker active..."
            sleep 240
          done &

      # ─────────────────────────────────────────────
      # RUN BOT
      # ─────────────────────────────────────────────

      - name: Run Landscape Live Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YOUTUBE_STREAM_URL:  ${{ secrets.YOUTUBE_STREAM_URL }}

          # FFmpeg stability
          FFMPEG_THREADS: 2

          # Prevent buffering stalls
          PYTHONUNBUFFERED: 1

        run: |
          echo "🚀 Starting Metropolitan Landscape Live Engine..."
          python bot_runner.py

      # ─────────────────────────────────────────────
      # AUTO RESTART HANDOFF
      # ─────────────────────────────────────────────

      - name: Check for Stream Resume Handoff
        if: always()

        run: |
          if [ -f "stream_state_h.txt" ]; then

            echo "🔄 Landscape resume checkpoint found."
            echo "🚀 Deploying fresh GitHub runner..."

            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/longstream.yml/dispatches \
              -d '{"ref":"main"}'

          else

            echo "✅ Landscape stream completed normally."
            echo "🛑 No restart required."

          fi