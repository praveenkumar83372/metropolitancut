name: Metropolitan Shorts Live

on:
  workflow_dispatch:

jobs:
  shorts-live:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

      # ─────────────────────────────────────────────
      # CHECKOUT
      # ─────────────────────────────────────────────

      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────
      # PYTHON
      # ─────────────────────────────────────────────

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      # ─────────────────────────────────────────────
      # FFMPEG INSTALL
      # ─────────────────────────────────────────────

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          echo "FFmpeg Version:"
          ffmpeg -version | head -1

      # ─────────────────────────────────────────────
      # PYTHON DEPENDENCIES
      # ─────────────────────────────────────────────

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gdown==4.7.3

      # ─────────────────────────────────────────────
      # SYSTEM OPTIMIZATION
      # ─────────────────────────────────────────────

      - name: Optimize Linux Network Buffers
        run: |
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 16777216"
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 16777216"

      # ─────────────────────────────────────────────
      # KEEP ALIVE LOGGER
      # ─────────────────────────────────────────────

      - name: Keep-alive heartbeat
        run: |
          while true; do
            echo "⏳ $(date '+%H:%M:%S') — livestream worker active..."
            sleep 240
          done &

      # ─────────────────────────────────────────────
      # RUN BOT
      # ─────────────────────────────────────────────

      - name: Run Shorts Live Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YOUTUBE_STREAM_URL:  ${{ secrets.YOUTUBE_STREAM_URL }}
          FFMPEG_THREADS: 2
          PYTHONUNBUFFERED: 1
        run: |
          echo "🚀 Starting Metropolitan Shorts Live Engine..."
          python bot_runner.py

      # ─────────────────────────────────────────────
      # AUTO RESTART HANDOFF
      # ─────────────────────────────────────────────

      - name: Check for Stream Resume Handoff
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "stream_state.txt" ]; then
            echo "🔄 Resume checkpoint found."
            echo "🚀 Deploying fresh GitHub runner..."

            gh workflow run shortstream.yml --ref main

          else
            echo "✅ Stream completed normally."
            echo "🛑 No restart required."
          fi
